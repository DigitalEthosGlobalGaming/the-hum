# Same pipeline for GitLab (if the repo is mirrored there): publishes to GitLab Pages.
image: node:24

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

before_script:
  - npm ci --cache .npm --prefer-offline

test:
  stage: test
  script:
    - npm run validate
    - npm test
    - npm run sweep
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  script:
    - npm run build
    - mkdir -p public
    - cp dist/the-hum.html public/index.html
    - cp dist/the-hum.html public/the-hum.html
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
